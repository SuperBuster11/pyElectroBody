name: Build Windows exe

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ElectroMan --add-data "data;data" em.py

      - uses: actions/upload-artifact@v4
        with:
          name: ElectroMan-windows-${{ matrix.arch }}
          path: dist/ElectroMan.exe
